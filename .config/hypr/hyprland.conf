################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/

monitor=eDP-1,preferred,auto, 1.2

#################
#### IMPORTS ####
#################

# See https://wiki.hyprland.org/Configuring/Keywords/

source = $HOME/.config/hypr/keybinds.conf
source = $HOME/.config/hypr/colors.conf
source = $HOME/.config/hypr/transparency.conf

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
exec-once = /usr/lib/kf5/klauncher
exec-once = kded5
exec-once = kdeinit5
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = waybar
exec-once = hypridle & hyprsunset
exec-once = swww-daemon 
exec-once = blueman-applet
exec-once = kdeconnectd
exec-once = wl-paste --type text --watch cliphist store && wl-paste --type image --watch cliphist store
# exec-once = eww daemon
exec-once = nm-applet & 
exec-once = pidof -x ~/.scripts/battery.sh || ~/.scripts/battery.sh
exec-once = pidof -x ~/.scripts/open-music-widget.sh || ~/.scripts/open-music-widget.sh
exec-once = pidof -x ~/.scripts/reminder.sh || ~/.scripts/reminder.sh
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = kitty
exec-once = [workspace 2 silent] bash -c " sleep 2 && zen-browser"
exec-once = [workspace 10 silent] bash -c "sleep 3 && spotify-launcher"
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = hyprctl setcursor "Furina-v2" 32
exec-once = vicinae server
exec-once = qs -c /home/tensai/dotfiles/.config/quickshell/overview
exec-once = hyprpm reload
exec-once = hyprpm enable hyprscrolling && hyprctl reload
exec-once = fcitx5 -d
# env = GTK_THEME,catppuccin-macchiato-mauve-standard+default


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XDG_CONFIG_HOME, /home/tensai/.config
# This tells Qt applications to use qt6ct for styling
env = QT_QPA_PLATFORMTHEME,qt6ct

# See https://wiki.hyprland.org/Configuring/Environment-variables/

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 5
    no_focus_fallback = true
    border_size = 2
    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = scrolling
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    # rounding_power = 2

    # Change transparency of focused and unfocused windows
    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.2
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations

animations {
    enabled = 1
    bezier = default, 0.12, 0.92, 0.08, 1.0
    bezier = wind, 0.12, 0.92, 0.08, 1.0
    bezier = overshot, 0.18, 0.95, 0.22, 1.03
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 5, wind, slide 60%
    animation = windowsIn, 1, 6, overshot, popin 60%
    animation = windowsOut, 1, 6, overshot, popin 60%
    animation = windowsMove, 1, 4, overshot, slide
    animation = layers, 1, 4, default
    animation = fadeIn, 1, 7, default
    animation = fadeOut, 1, 7, default
    animation = fadeSwitch, 1, 7, default
    animation = fadeShadow, 1, 7, default
    animation = fadeDim, 1, 7, default
    animation = fadeLayers, 1, 7, default
    animation = workspaces, 1, 5, overshot, slidevert
    animation = border, 1, 1, liner
    animation = borderangle, 1, 24, liner, loop
}
# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more


# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_splash_rendering = true
    focus_on_activate = true
    disable_hyprland_logo = true
}

xwayland:force_zero_scaling =true

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,jp
    kb_variant =
    kb_model =
    kb_options = caps:escape_shifted_capslock
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*
# Make all floating windows fully opaque (1.0 = non-transparent)
windowrulev2 = opacity 1.0,floating:1
windowrulev2 = float, class:org.kde.kcalc
windowrulev2 = size 400 550, class:org.kde.kcalc
windowrulev2 = center, class:org.kde.kcalc
windowrulev2 = float, class:^(net.tagaini.tagainijisho)$
windowrulev2 = size 50% 40%, class:^(net.tagaini.tagainijisho)$
windowrulev2 = center, class:^(net.tagaini.tagainijisho)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = size 50% 50%, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = size 55% 65%, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = center, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, class:^(chrome-dbjphokaleffeehcjmadaemnceglddkd-Defau)$
windowrulev2 = size 50% 40%, class:^(chrome-dbjphokaleffeehcjmadaemnceglddkd-Defau)$
windowrulev2 = center, class:^(chrome-dbjphokaleffeehcjmadaemnceglddkd-Defau)$




layerrule = blur, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = ignorezero, swaync
layerrule = ignorezero, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = animation appleEase, swaync-control-center
layerrule = blur, swaync
layerrule = blur,vicinae
layerrule = ignorealpha 0, vicinae
windowrulev2 = opacity 0.8 0.8,class:^(vicinae)$

# Fix some dragging issues with XWayland
# windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0


#### PLUGINS ####

# This will toggle HyprExpo when SUPER+g is pressed


plugin {
    hyprscrolling {
        column_width = 0.5
        fullscreen_on_one_column = true
        focus_fit_method = 1
    }
}
