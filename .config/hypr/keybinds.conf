###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

$terminal = kitty
$fileManager = nemo
$menu = tofi-drun | xargs -r hyprctl dispatch exec --
$browser = zen-browser


windowrulev2 = float, class:floating 
windowrulev2 = size 1000 550, class:floating
windowrulev2 = move 300 240, class:floating

windowrulev2 = float, class:float-right 
windowrulev2 = size 590 850, class:float-right
windowrulev2 = move 1000 40, class:float-right

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more

# Exit Hyprland
# bind = $mainMod SHIFT, M, exit

#####################
#####LAUCNH APPS#####
#####################

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, E, exec, kitty  --class floating -e spf
bind = $mainMod, W, togglefloating,
bind = $mainMod, A, exec, $menu
bind = $mainMod, D, exec, docker desktop start
bind = ALT, space, exec, $menu
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod SHIFT, P, exec, hyprpicker -a   
bind = $mainMod, backspace, exec, wlogout
bind = $mainMod SHIFT, R, exec, ~/.scripts/rwaybar.sh
bind = $mainMod, I, exec, swaync-client -t
bind = $mainMod, S, exec, spotify-launcher
bind = $mainMod SHIFT, W, exec, ~/.scripts/wallchange
bind = $mainMod, R, exec, ~/.scripts/launch_scripts.sh
bind = $mainMod, V, exec, vicinae vicinae://extensions/vicinae/clipboard/history
bind = $mainMod, F, exec, vicinae vicinae://extensions/vicinae/file/search
bind = $mainMod, T, exec, kitty --class floating && clear
bind = $mainMod, Z, exec, $browser
bind = $mainMod SHIFT, Z, exec, $browser --private-window
bind = $mainMod ALT, F, pin
bind = $mainMod, O, exec, vicinae vicinae://extensions/vicinae/vicinae/search-emojis
bind = $mainMod, G, exec, flatpak run com.usebottles.bottles 
bind = $mainModn, apostrophe, exec, kcalc
bind = $mainMod, F12, exec, /home/tensai/.config/rofi/applets/bin/volume.sh
bind = $mainMod, F11, exec, /home/tensai/.scripts/run
bind = ALT, space, exec, vicinae toggle
bind = $mainMod, TAB, exec, qs ipc -c /home/tensai/.config/quickshell/overview call overview toggle
bind = $mainMod SHIFT, M, exec, /usr/bin/chromium --profile-directory=Defau --app=https://memos.geniuspace.in/
bind = ,XF86Explorer, exec, $(grep -E "^(bind|binde|bindm)" "/home/tensai/.config/hypr/keybinds.conf" \
    | sed 's/^bind[e,m]*=//g' \
    | awk -F',' '{printf "%-15s %-10s %-10s %-30s\n",$1, $2, $3, $4}' \
    | rofi -dmenu -i -p " " -theme-str 'window {width: 800px;} listview {lines: 20;}' -theme '~/.config/rofi/launchers/type-1/style-2.rasi')



# Mouse Binds
bind = $mainMod, mouse:275, exec, kitty --class float-right

# Media controls
bind = $mainMod, N, exec, playerctl next -p spotify
bind = $mainMod SHIFT, N, exec, playerctl previous -p spotify
bind = $mainMod, Space, exec, playerctl play-pause -p spotify
bind = ,XF86AudioPlay, exec, playerctl play
bind = ,XF86AudioPause, exec, playerctl pause


# Remapping
bind = ALT, left, exec, wtype -P Home
bind = ALT, right, exec, wtype -P End

# Bluelight filter
bind = $mainMod, F9, exec, hyprctl hyprsunset temperature 4500
bind = $mainMod, F8, exec, hyprctl hyprsunset identity

# screenshot 
# bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy && wl-paste > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png | notify-send "Screenshot of the region taken" -t 1000 # screenshot of a region 
bind = $mainMod SHIFT, Print, exec, quickshell -c /home/tensai/dotfiles/.config/quickshell/hyprquickshot -n
bind = $mainMod, Print, exec, hyprctl hyprsunset gamma 30 && sleep 0.01 && hyprctl hyprsunset gamma 100 && grim - | wl-copy && wl-paste > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png | notify-send "Screenshot of whole screen taken" -t 1000 -i ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png
bind = $mainMod SHIFT, T, exec, ~/.scripts/tess.sh
bind = $mainMod SHIFT, V, exec, [workspace 10 silent] kitty -e ~/.scripts/screenrec

# Move focus with mainMod + arrow keys
# bind = $mainMod, left, movefocus, l
# bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move active window around current workspace 
bindde = $mainMod Shift Control, left, Move active window to the left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
bindde = $mainMod Shift Control, right, Move active window to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
bindde = $mainMod Shift Control, up, Move active window up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
bindde = $mainMod Shift Control, down, Move active window down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Resize windows
# bindde = $mainMod Shift, Right, $d resize window right , resizeactive, 30 0
# bindde = $mainMod Shift, Left, $d resize window left, resizeactive, -30 0
# bindde = $mainMod Shift, Up, $d resize window up, resizeactive, 0 -30
# bindde = $mainMod Shift, Down, $d resize  window down, resizeactive, 0 30


bind = $mainMod SHIFT, right, layoutmsg, colresize +0.05
bind = $mainMod SHIFT, left, layoutmsg, colresize -0.05
bind = $mainMod SHIFT, up, resizeactive, 0 -20
bind = $mainMod SHIFT, down, resizeactive, 0 20
bind = $mainMod, M, layoutmsg, colresize all 0.5
bind = $mainMod, right, layoutmsg, move +col
bind = $mainMod, left, layoutmsg, move -col
bind = $mainMod, L, layoutmsg, move +col
bind = $mainMod, H, layoutmsg, move -col
bind = $mainMod CTRL, right, layoutmsg, movewindowto r
bind = $mainMod CTRL, left, layoutmsg, movewindowto l
bind = $mainMod CTRL, up, layoutmsg, movewindowto u
bind = $mainMod CTRL, down, layoutmsg, movewindowto d
bind = $mainMod, mouse_down,layoutmsg, move +col
bind = $mainMod, mouse_up, layoutmsg, move -col
####################
#### Workspaces ####
####################

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move to workspace silent
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10


# Example special workspace (scratch)
bind = $mainMod SHIFT, S, togglespecialworkspace, magic
bind = $mainMod ALT, S, movetoworkspace, special:magic
bind = ALT, Return, fullscreen
# Scroll through existing workspaces with mainMod + scroll

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#########################################
#### Volume, Brightness and Capslock ####
#########################################

# Sink volume toggle mute
bind = , XF86AudioMute, exec, ~/.scripts/vol.sh mute
# Source volume toggle mute
bind = , XF86AudioMicMute, exec, ~/.scripts/togglemute.sh
binde = , XF86AudioRaiseVolume, exec, ~/.scripts/vol.sh up
binde = , XF86AudioLowerVolume, exec, ~/.scripts/vol.sh down
binde = CTRL, XF86AudioRaiseVolume, exec, ~/.scripts/brigh.sh up
binde = CTRL, XF86AudioLowerVolume, exec, ~/.scripts/brigh.sh down
# Capslock 
bind = , Caps_Lock, exec, ~/.scripts/caps_lock.sh
# Brightness raise
binde = , XF86MonBrightnessUp, exec, ~/.scripts/brigh.sh up
# Brightness lower
binde = , XF86MonBrightnessDown, exec, ~/.scripts/brigh.sh down

bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
